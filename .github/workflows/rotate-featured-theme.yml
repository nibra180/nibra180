name: Rotate featured Omarchy theme

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Rotate featured theme
        run: python scripts/rotate_featured_theme.py

      - name: Commit updated README
        run: |
          if git diff --quiet -- README.md; then
            echo "Featured theme is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Rotate featured Omarchy theme"
          git push
